      summary: IIC override of the AI priority
      description: |-
        Stores override_priority, override_reason, overridden_by; written to the audit log. NEW-2 (IIC request queue, waiting list and prioritisation).

        **User stories:** NEW-2 IIC request queue, waiting list and prioritisation; NEW-6 Audit history and moderation
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - override_priority
              - override_reason
              properties:
                override_priority:
                  type: string
                  enum:
                  - HIGH
                  - MEDIUM
                  - LOW
                override_reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Updated assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityAssessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-user-stories:
      - NEW-2
      - NEW-6
      operationId: patch_requests_id_priority
  /assistant/chat/:
    post:
      tags:
      - Sprint 1 - Assistant
      summary: Ask Sangam helpdesk (messages are never stored)
      description: |-
        Any logged-in user. BM25 retrieval over published KnowledgeArticles for the user's audience; the LLM (if configured)
        answers only from those articles. Requests to approve / assign / pair are refused before any model call, and questions that are
        not about the Sangam app (weather, homework, general career advice) are declined by a domain guardrail (scope: out_of_scope).
        Available to students, mentors and IIC admins.
        Throttled 10/minute per user. Alias `/ai/chat/`. NEW-7 (Ask Sangam help assistant).

        **User stories:** NEW-7 Ask Sangam help assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 2
                  maxLength: 1000
      responses:
        '200':
          description: Answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/Throttled'
      x-user-stories:
      - NEW-7
      operationId: post_assistant_chat
  /mentorships/{id}/meetings/{mid}/summary/:
    post:
      tags:
      - Sprint 2 - Summaries
      summary: Draft summary and action items from the mentor's own notes (KAN-57)
      description: |-
        Mentor of this mentorship only. PII is stripped and input capped at 2,000 words before the LLM call (prompt `summary_v1`,
        15 s timeout, one retry on invalid JSON). Falls back to an extractive summary. **Nothing is stored.** Throttled 10/hour. 4.2 (Session log (date and length only)).

        **User stories:** 4.2 Session log (date and length only)
      parameters:
      - $ref: '#/components/parameters/MentorshipId'
      - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notes
              properties:
                notes:
                  type: string
                  minLength: 20
      responses:
        '200':
          description: Draft for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/Throttled'
        '503':
          description: LLM timed out; the extractive draft is returned with fallback=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryDraft'
      x-user-stories:
      - '4.2'
      operationId: post_mentorships_id_meetings_mid_summary
  /mentorships/{id}/meetings/{mid}/summary/confirm/:
    post:
      tags:
      - Sprint 2 - Summaries
      summary: Confirm (save) a user-edited summary
      description: |-
        Saves only if `SANGAM_STORE_AI_SUMMARIES=1` (pending team/TA decision; default off → returns stored=false and keeps nothing).
        Prompt version is recorded with every saved summary. Discarding = simply not calling this endpoint. 4.2 (Session log (date and length only)).

        **User stories:** 4.2 Session log (date and length only)
      parameters:
      - $ref: '#/components/parameters/MentorshipId'
      - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - summary
              properties:
                summary:
                  type: string
                action_items:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                prompt_version:
                  type: string
                  example: summary_v1
      responses:
        '200':
          description: Not stored (storage disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryConfirm'
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryConfirm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-user-stories:
      - '4.2'
      operationId: post_mentorships_id_meetings_mid_summary_confirm
  /admin/insights/:
    get:
      tags:
      - Sprint 2 - Insights
      summary: Participation and effectiveness metrics (aggregates only, KAN-58)
      description: |-
        IIC only. Counts and rates, never chat or note content. Also keeps the Milestone-2 keys. 5.4 (Programme insights for the IIC).

        **User stories:** 5.4 Programme insights for the IIC
      responses:
        '200':
          description: Insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-user-stories:
      - '5.4'
      operationId: get_admin_insights
  /admin/insights/at-risk/:
    get:
      tags:
      - Sprint 2 - Insights
      summary: Mentorships likely to go quiet (advisory)
      description: |-
        IIC only. Transparent weighted risk score (`dropoff_weighted_v1`, weights fitted on synthetic timelines) on days since last
        meeting, meeting-frequency drop, no-shows, overdue feedback, open alerts and stale goals. The 14-day inactivity rule lifts
        LOW to MEDIUM. Every flag has reasons; flags never change any status. 5.3 (Inactivity alerts).

        **User stories:** 5.3 Inactivity alerts
      parameters:
      - name: min_level
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          default: MEDIUM
      responses:
        '200':
          description: Flagged mentorships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtRiskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-user-stories:
      - '5.3'
      operationId: get_admin_insights_at_risk
  /ai/health/:
    get:
      tags:
      - Health
      summary: Is the embedding model / LLM available?
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedding_backend:
                    type: string
                    enum:
                    - minilm
                    - gemini
                    - none
                  embedding_available:
                    type: boolean
                  fallbacks_ready:
                    type: boolean
                  llm:
                    type: object
                    properties:
                      provider:
                        type: string
                        enum:
                        - gemini
                        - ollama
                        - none
                      available:
                        type: boolean
                      keys_configured:
                        type: integer
                      keys_marked_unusable:
                        type: integer
                      error:
                        type: string
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-user-stories: []
      description: '**User stories:** none (supporting endpoint)'
      operationId: get_ai_health
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MentorshipId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MeetingId:
      name: mid
      in: path
      required: true
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Wrong role (e.g. student or mentor calling an IIC endpoint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Request, mentorship or meeting not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Semantically invalid value (e.g. k outside 1–20, missing override reason)
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
              field:
                type: string
    Throttled:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenIIC:
      description: Caller is not an IIC administrator
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenNotParticipant:
      description: Caller is not the student or mentor of this mentorship (the IIC is allowed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
    Candidate:
      type: object
      properties:
        mentor_id:
          type: integer
        name:
          type: string
          description: First name only
        headline:
          type: string
        domain:
          type: string
        specialty:
          type: string
        experience_years:
          type: integer
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
        explanation:
          type: string
        features:
          type: object
          additionalProperties:
            type: number
    SuggestionResponse:
      type: object
      properties:
        request_id:
          type: integer
        algorithm:
          type: string
          enum:
          - hybrid_v1
          - rule_based_v1
        embedding_model_used:
          type: boolean
        fallback:
          type: boolean
        fallback_reason:
          type: string
          nullable: true
        llm_explanations_used:
          type: boolean
        k:
          type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        advisory_only:
          type: boolean
        approval_required:
          type: boolean
        student_cannot_choose:
          type: boolean
    PriorityAssessment:
      type: object
      properties:
        request_id:
          type: integer
        assessment_id:
          type: integer
        suggested_priority:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        effective_priority:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        explanation:
          type: string
          example: waiting 15 days; deadline in about 5 days
        confidence:
          type: number
        factors:
          type: object
        algorithm:
          type: string
          example: priority_points_v1
        override_priority:
          type: string
          nullable: true
        override_reason:
          type: string
          nullable: true
        overridden_by:
          type: integer
          nullable: true
        overridden_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        advisory_only:
          type: boolean
    ChatResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
        llm_used:
          type: boolean
        scope:
          type: string
          enum:
          - answered
          - refused_decision
          - out_of_scope
          - no_article
          description: out_of_scope = not about the Sangam app, declined
        local_ai_used:
          type: boolean
        fallback:
          type: boolean
        message_stored:
          type: boolean
          enum:
          - false
        human_approval_required_for_matches:
          type: boolean
    SummaryDraft:
      type: object
      properties:
        meeting_id:
          type: integer
        summary:
          type: string
        action_items:
          type: array
          maxItems: 5
          items:
            type: string
        generated:
          type: boolean
        fallback:
          type: boolean
        provider:
          type: string
          enum:
          - gemini
          - ollama
          - extractive
        prompt_version:
          type: string
          example: summary_v1
        pii_removed:
          type: object
          additionalProperties:
            type: integer
        input_truncated:
          type: boolean
        stored:
          type: boolean
          enum:
          - false
        review_required:
          type: boolean
        detail:
          type: string
    SummaryConfirm:
      type: object
      properties:
        stored:
          type: boolean
        id:
          type: integer
        summary:
          type: string
        action_items:
          type: array
          items:
            type: string
        prompt_version:
          type: string
        detail:
          type: string
    Insights:
      type: object
      properties:
