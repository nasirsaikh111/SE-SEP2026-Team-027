      description: '**User stories:** NEW-7 Ask Sangam help assistant and its help articles'
  /assistant/chat/:
    post:
      tags:
      - Sprint 1 - Assistant
      summary: Ask Sangam helpdesk (messages are never stored)
      description: |-
        Any logged-in user. BM25 retrieval over published KnowledgeArticles for the user's audience; the LLM (if configured)
        answers only from those articles. Requests to approve / assign / pair are refused before any model call, and questions that are
        not about the Sangam app (weather, homework, general career advice) are declined by a domain guardrail (scope: out_of_scope).
        Available to students, mentors and IIC admins.
        Throttled 10/minute per user. Alias `/ai/chat/`. NEW-7 (Ask Sangam help assistant).

        **User stories:** NEW-7 Ask Sangam help assistant and its help articles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 2
                  maxLength: 1000
      responses:
        '200':
          description: Answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/NotAuthenticated'
        '429':
          $ref: '#/components/responses/Throttled'
      x-user-stories:
      - NEW-7
      operationId: post_assistant_chat
  /admin/knowledge/:
    get:
      tags:
      - Sprint 1 - Assistant
      operationId: listKnowledgeArticlesAdmin
      summary: IIC lists all help articles (published and drafts) used by Ask Sangam
      x-user-stories:
      - NEW-7
      responses:
        '200':
          description: Up to 100 articles, last updated first
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/KnowledgeArticle'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
      description: '**User stories:** NEW-7 Ask Sangam help assistant and its help articles'
    post:
      tags:
      - Sprint 1 - Assistant
      operationId: createKnowledgeArticle
      summary: IIC adds a help article; only published articles are used by Ask Sangam
      description: |-
        **Known issue (Sprint 2):** fields are not validated, so an empty title or an unknown audience is saved.

        **User stories:** NEW-7 Ask Sangam help assistant and its help articles
      x-user-stories:
      - NEW-7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeArticleInput'
      responses:
        '201':
          description: Article created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticle'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
  /admin/knowledge/{id}/:
    get:
      tags:
      - Sprint 1 - Assistant
      operationId: getKnowledgeArticle
      summary: IIC reads one help article
      x-user-stories:
      - NEW-7
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticle'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** NEW-7 Ask Sangam help assistant and its help articles'
    patch:
      tags:
      - Sprint 1 - Assistant
      operationId: updateKnowledgeArticle
      summary: IIC edits or publishes a help article
      x-user-stories:
      - NEW-7
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeArticleInput'
      responses:
        '200':
          description: Updated article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticle'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** NEW-7 Ask Sangam help assistant and its help articles'
    delete:
      tags:
      - Sprint 1 - Assistant
      operationId: deleteKnowledgeArticle
      summary: IIC deletes a help article
      x-user-stories:
      - NEW-7
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** NEW-7 Ask Sangam help assistant and its help articles'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MentorshipId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MeetingId:
      name: mid
      in: path
      required: true
      schema:
        type: integer
    MeetingPathId:
      name: id
      in: path
      required: true
      description: Meeting id
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not logged in, or wrong role (e.g. student or mentor calling an IIC endpoint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Request, mentorship or meeting not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Semantically invalid value (e.g. k outside 1–20, missing override reason)
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
              field:
                type: string
    Throttled:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenIIC:
      description: Not logged in, or the caller is not an IIC administrator
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenNotParticipant:
      description: Not logged in, or the caller is not the student or mentor of this mentorship (the IIC is allowed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAuthenticated:
      description: 'Not logged in: missing, invalid or expired token. The API returns 403 (not 401) because SessionAuthentication
        is listed first in REST_FRAMEWORK settings.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
    Candidate:
      type: object
      properties:
        mentor_id:
          type: integer
        name:
          type: string
          description: First name only
        headline:
          type: string
        domain:
          type: string
        specialty:
          type: string
        experience_years:
          type: integer
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
        explanation:
          type: string
        features:
          type: object
          additionalProperties:
            type: number
    SuggestionResponse:
      type: object
      properties:
        request_id:
          type: integer
        algorithm:
          type: string
          enum:
          - hybrid_v1
          - rule_based_v1
        embedding_model_used:
          type: boolean
        fallback:
          type: boolean
        fallback_reason:
          type: string
          nullable: true
        llm_explanations_used:
          type: boolean
        k:
          type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        advisory_only:
          type: boolean
        approval_required:
          type: boolean
        student_cannot_choose:
          type: boolean
    PriorityAssessment:
      type: object
      properties:
        request_id:
          type: integer
        assessment_id:
          type: integer
        suggested_priority:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        effective_priority:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        explanation:
          type: string
          example: waiting 15 days; deadline in about 5 days
        confidence:
          type: number
        factors:
          type: object
        algorithm:
          type: string
          example: priority_points_v1
        override_priority:
          type: string
          nullable: true
        override_reason:
          type: string
          nullable: true
        overridden_by:
          type: integer
          nullable: true
        overridden_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        advisory_only:
          type: boolean
    ChatResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
        llm_used:
          type: boolean
        scope:
          type: string
          enum:
          - answered
          - refused_decision
          - out_of_scope
          - no_article
          description: out_of_scope = not about the Sangam app, declined
        local_ai_used:
          type: boolean
        fallback:
          type: boolean
        message_stored:
          type: boolean
          enum:
          - false
        human_approval_required_for_matches:
          type: boolean
    SummaryDraft:
