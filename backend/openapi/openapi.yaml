openapi: 3.0.3
info:
  title: Sangam API (Milestone 3, Sprint 1)
  version: 1.2.0
  description: |
    REST API of **Sangam**, the IITM BS student mentoring and career support platform (Team 027).
    Django REST Framework backend; all paths are under `/api/v1`. Every endpoint needs a JWT bearer token unless marked otherwise.

    **Roles:** STUDENT (primary user), MENTOR (alumni volunteer, secondary), ADMIN (IIC / Placement Cell, tertiary).
    **Key rules (from the IIC requirements meeting):** the IIC keeps the mentor repository and approves every student and every
    match; the system only suggests mentors; one mentor per student and one mentee per mentor; written feedback only (no ratings);
    meetings are logged by date and length, never content; contact details are shared only after the IIC approves the match.

    **Error format:** validation errors return 400 with a field → messages map (or a list of messages); wrong role returns 403;
    a missing or invalid token returns 401; unknown ids return 404. AI endpoints return 422 with `detail` and `field` for
    semantically invalid values, and 429 when rate-limited.

    **User-story mapping.** Each operation lists its stories in `x-user-stories` and at the end of its description.
    Numbers are the user stories of the Milestone 1 report; NEW-n are stories added after the IIC meeting.

    | ID | User story |
    |---|---|
    | 1.1 | Record mentoring need |
    | 1.3 | Submit a mentoring request (revised: one open request; IIC selects the mentor) |
    | 1.4 | Track request status and notifications |
    | 2.2 | Mentor availability and capacity |
    | 2.3 | Mentor reviews the need before confirming availability |
    | 3.1 | System-suggested mentors for the IIC |
    | 3.2 | IIC checks availability and approves the match |
    | 3.3 | IIC mentor repository and verification (revised: IIC adds mentors) |
    | 4.1 | Shared goals |
    | 4.2 | Session log (date and length only) |
    | 4.3 | Mentor sees current mentee |
    | 5.1 | Closing feedback (revised: written, no ratings) |
    | 5.2 | Record outcomes |
    | 5.3 | Inactivity alerts |
    | 5.4 | Programme insights for the IIC |
    | NEW-1 | Student registration and IIC approval |
    | NEW-2 | IIC request queue, waiting list and prioritisation |
    | NEW-3 | Fortnightly mentor progress feedback |
    | NEW-4 | Change-of-mentor request and reassignment |
    | NEW-5 | End a mentorship |
    | NEW-6 | Audit history and moderation |
    | NEW-7 | Ask Sangam help assistant |

    AI details (models, fallbacks, privacy) are kept from the AI/ML section written for KAN-46/KAN-57/KAN-58.
servers:
- url: http://127.0.0.1:8000/api/v1
security:
- bearerAuth: []
tags:
- name: Auth & accounts
- name: IIC - student approvals
- name: IIC - mentor repository
- name: Requests
- name: IIC - matching
- name: Mentor
- name: Mentorships
- name: Feedback & outcomes
- name: Notifications
- name: IIC - monitoring
- name: Sprint 1 - Matching
- name: Sprint 1 - Priority
- name: Sprint 1 - Assistant
- name: Sprint 2 - Summaries
- name: Sprint 2 - Insights
- name: Health
paths:
  /auth/register/:
    post:
      tags:
      - Auth & accounts
      operationId: registerStudent
      summary: Student registers (account starts PENDING until the IIC approves it)
      description: |-
        Creates a STUDENT user and StudentProfile. The email must be an iitm.ac.in address (or a subdomain such as
        ds.study.iitm.ac.in). The account cannot request a mentor until the IIC approves it.

        **User stories:** NEW-1 Student registration and IIC approval
      x-user-stories:
      - NEW-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
            example:
              email: 23f1000001@ds.study.iitm.ac.in
              password: Str0ngPass!
              first_name: Meera
              last_name: Iyer
              iitm_roll_number: 23f1000001
              level: DEGREE
              courses:
              - MLF
              - MLT
              - DBMS
              cgpa: 8.2
      responses:
        '201':
          description: Registered, waiting for IIC approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  approval_status:
                    type: string
                    enum:
                    - PENDING
                  message:
                    type: string
                    example: IIC approval required.
        '400':
          description: 'Validation error: not an IITM email, email already registered, weak password, level not allowed, empty
            courses, CGPA outside 0–10'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
  /auth/token/:
    post:
      tags:
      - Auth & accounts
      operationId: login
      summary: Log in and receive a JWT access and refresh token pair
      description: |-
        Used by all three roles. The frontend reads the role from /auth/me/ and routes to /student, /mentor or /admin.

        **User stories:** NEW-1 Student registration and IIC approval
      x-user-stories:
      - NEW-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password, or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/token/refresh/:
    post:
      tags:
      - Auth & accounts
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      x-user-stories:
      - NEW-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '**User stories:** NEW-1 Student registration and IIC approval'
  /auth/me/:
    get:
      tags:
      - Auth & accounts
      operationId: getCurrentUser
      summary: Current user, role and (for students) approval status
      description: |-
        Drives role-based routing and shows the student's approval status on the home page.

        **User stories:** NEW-1 Student registration and IIC approval; 1.4 Track request status and notifications
      x-user-stories:
      - NEW-1
      - '1.4'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /students/me/:
    get:
      tags:
      - Auth & accounts
      operationId: getStudentProfile
      summary: Student reads their academic profile and approval status
      x-user-stories:
      - NEW-1
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** NEW-1 Student registration and IIC approval'
    patch:
      tags:
      - Auth & accounts
      operationId: updateStudentProfile
      summary: Student corrects academic details before approval (resets status to PENDING)
      description: |-
        Locked once the IIC has approved the profile.

        **User stories:** NEW-1 Student registration and IIC approval
      x-user-stories:
      - NEW-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfile'
      responses:
        '200':
          description: Updated profile (approval_status back to PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a student, or the profile is already approved and locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/students/:
    get:
      tags:
      - IIC - student approvals
      operationId: listStudentsForReview
      summary: IIC lists student registrations by approval status (default PENDING)
      x-user-stories:
      - NEW-1
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          default: PENDING
      responses:
        '200':
          description: Up to 200 registrations, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/StudentProfile'
                  - type: object
                    properties:
                      id:
                        type: integer
                      user_id:
                        type: integer
                      email:
                        type: string
                      name:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
      description: '**User stories:** NEW-1 Student registration and IIC approval'
  /admin/students/{id}/review/:
    post:
      tags:
      - IIC - student approvals
      operationId: reviewStudent
      summary: IIC approves or rejects a student registration against the checklist
      description: |-
        Approval requires `academic_verified: true` and a complete record (IITM roll number, level, courses, CGPA).
        Rejection requires a reason. The student is notified and the decision is written to the audit log.

        **User stories:** NEW-1 Student registration and IIC approval; NEW-6 Audit history and moderation
      x-user-stories:
      - NEW-1
      - NEW-6
      parameters:
      - name: id
        in: path
        required: true
        description: Student user id
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVED
                  - REJECTED
                reason:
                  type: string
                  description: Required when decision is REJECTED
                academic_verified:
                  type: boolean
                  default: false
                  description: Must be true to approve
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          description: Missing rejection reason, academic_verified not set, or incomplete academic record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/mentors/:
    get:
      tags:
      - IIC - mentor repository
      operationId: listMentors
      summary: IIC views the mentor repository
      x-user-stories:
      - '3.3'
      - '2.2'
      responses:
        '200':
          description: Up to 200 mentors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MentorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
      description: '**User stories:** 3.3 IIC mentor repository and verification (revised: IIC adds mentors); 2.2 Mentor availability
        and capacity'
    post:
      tags:
      - IIC - mentor repository
      operationId: addMentor
      summary: IIC adds an alumni mentor to the repository (mentors do not self-register)
      description: |-
        Creates the mentor with no usable password; the IIC then sends an invitation (see /admin/mentors/{id}/invite/).

        **User stories:** 3.3 IIC mentor repository and verification (revised: IIC adds mentors); NEW-6 Audit history and moderation
      x-user-stories:
      - '3.3'
      - NEW-6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorCreate'
      responses:
        '201':
          description: Mentor added, not yet verified or activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  is_verified:
                    type: boolean
                    enum:
                    - false
                  activation:
                    type: string
        '400':
          description: Email already exists, or a field is missing or out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
  /admin/mentors/{id}/verify/:
    post:
      tags:
      - IIC - mentor repository
      operationId: verifyMentor
      summary: IIC marks a mentor as verified against alumni records
      description: |-
        Requires the alumni roll number and graduation year on the profile. Only verified mentors can be suggested.

        **User stories:** 3.3 IIC mentor repository and verification (revised: IIC adds mentors); NEW-6 Audit history and moderation
      x-user-stories:
      - '3.3'
      - NEW-6
      parameters:
      - name: id
        in: path
        required: true
        description: Mentor user id
        schema:
          type: integer
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentor_id:
                    type: integer
                  is_verified:
                    type: boolean
        '400':
          description: Alumni roll number or graduation year missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/mentors/{id}/invite/:
    post:
      tags:
      - IIC - mentor repository
      operationId: inviteMentor
      summary: IIC emails the mentor an activation link (token is never returned in the response)
      x-user-stories:
      - '3.3'
      parameters:
      - name: id
        in: path
        required: true
        description: Mentor user id
        schema:
          type: integer
      responses:
        '200':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                  email:
                    type: string
                  activation_screen_required:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** 3.3 IIC mentor repository and verification (revised: IIC adds mentors)'
  /auth/mentor/activate/:
    post:
      tags:
      - Auth & accounts
      operationId: activateMentor
      summary: Mentor sets a password from the invitation link
      x-user-stories:
      - '3.3'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - uid
              - token
              - password
              properties:
                uid:
                  type: string
                  description: Base64 user id from the link
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated:
                    type: boolean
        '400':
          description: Invalid or expired invitation, or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
      description: '**User stories:** 3.3 IIC mentor repository and verification (revised: IIC adds mentors)'
  /mentor/availability/:
    patch:
      tags:
      - Mentor
      operationId: setMentorAvailability
      summary: Verified mentor switches between Available and Busy
      description: |-
        Busy mentors are never suggested for new students; a current mentee is unaffected.

        **User stories:** 2.2 Mentor availability and capacity
      x-user-stories:
      - '2.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - is_available
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: New availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_available:
                    type: boolean
        '400':
          description: is_available is not a boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a verified mentor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /requests/:
    get:
      tags:
      - Requests
      operationId: listRequests
      summary: Student sees their own requests; the IIC sees the full queue
      x-user-stories:
      - '1.4'
      - NEW-2
      responses:
        '200':
          description: Up to 200 requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MentoringRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: '**User stories:** 1.4 Track request status and notifications; NEW-2 IIC request queue, waiting list and
        prioritisation'
    post:
      tags:
      - Requests
      operationId: createRequest
      summary: Approved student submits a mentoring request
      description: |-
        Pathway, domain, background and a problem statement of at least 80 characters. Only one open request
        (SUBMITTED, UNDER_REVIEW or WAITING) is allowed, and none while the student has an active mentorship.

        **User stories:** 1.1 Record mentoring need; 1.3 Submit a mentoring request (revised: one open request; IIC selects the mentor)
      x-user-stories:
      - '1.1'
      - '1.3'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentoringRequestInput'
            example:
              pathway: JOB
              domain: Data & ML
              background: Degree level, DS diploma done
              problem_statement: I can't decide between data analyst and ML engineer roles and don't know which projects or
                skills to focus on in the next 3 months.
      responses:
        '201':
          description: Request created with status SUBMITTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentoringRequest'
        '400':
          description: Problem statement under 80 characters, an open request already exists, or the student already has an
            active mentorship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not an IIC-approved student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /requests/{id}/withdraw/:
    post:
      tags:
      - Requests
      operationId: withdrawRequest
      summary: Student withdraws their open request
      description: |-
        Pending availability checks for the request are expired.

        **User stories:** 1.4 Track request status and notifications
      x-user-stories:
      - '1.4'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    enum:
                    - WITHDRAWN
        '400':
          description: Request is not open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not an IIC-approved student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found or not the caller's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/requests/{id}/suggestions/:
    get:
      tags:
      - IIC - matching
      operationId: getSuggestionsLegacy
      deprecated: true
      summary: Legacy alias of GET /requests/{id}/suggestions/
      description: |-
        Same engine and response as /requests/{id}/suggestions/. Kept for older frontend code; prefer the new path.

        **User stories:** 3.1 System-suggested mentors for the IIC
      x-user-stories:
      - '3.1'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: k
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
      responses:
        '200':
          description: Suggestions (advisory)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /admin/requests/{id}/availability/:
    post:
      tags:
      - IIC - matching
      operationId: sendAvailabilityCheck
      summary: IIC asks a suggested mentor whether they can take this student (expires in 7 days)
      description: |-
        The mentor must be verified, available and without an active mentee; the request must still be open and must not
        already have an unanswered check.

        **User stories:** 3.2 IIC checks availability and approves the match; 2.3 Mentor reviews the need before confirming availability
      x-user-stories:
      - '3.2'
      - '2.3'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mentor_id
              properties:
                mentor_id:
                  type: integer
      responses:
        '201':
          description: Availability check sent (status PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCheck'
        '400':
          description: Invalid mentor_id, mentor not verified or available, mentor already has a mentee, request not open,
            or a check is already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
  /availability/:
    get:
      tags:
      - Mentor
      operationId: listAvailabilityChecks
      summary: Mentor's inbox of availability checks (the IIC sees all)
      x-user-stories:
      - '2.3'
      responses:
        '200':
          description: Up to 100 checks, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is neither a mentor nor the IIC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '**User stories:** 2.3 Mentor reviews the need before confirming availability'
  /availability/{id}/:
    get:
      tags:
      - Mentor
      operationId: getAvailabilityCheck
      summary: Mentor reads the student's need before answering (identity hidden, contact details redacted)
      x-user-stories:
      - '2.3'
      parameters:
      - name: id
        in: path
        required: true
        description: Availability check id
        schema:
          type: integer
      responses:
        '200':
          description: Check with the anonymised request
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    enum:
                    - PENDING
                    - CONFIRMED
                    - DECLINED
                    - EXPIRED
                    - USED
                  expires_at:
                    type: string
                    format: date-time
                  request:
                    type: object
                    properties:
                      id:
                        type: integer
                      pathway:
                        type: string
                      domain:
                        type: string
                      background:
                        type: string
                      problem_statement:
                        type: string
