          type: integer
        outcomes:
          type: integer
        alerts_open:
          type: integer
        students_pending:
          type: integer
        mentors_unverified:
          type: integer
        mentors_verified:
          type: integer
        checks_pending:
          type: integer
        matches_awaiting_approval:
          type: integer
        domain_demand:
          type: array
          items:
            type: object
        pathway_demand:
          type: array
          items:
            type: object
        requests_by_status:
          type: array
          items:
            type: object
        outcomes_by_kind:
          type: array
          items:
            type: object
        closure_types:
          type: array
          items:
            type: object
        monthly_requests:
          type: array
          description: Last 6 months
          items:
            type: object
            properties:
              month:
