              type: integer
            open_requests:
              type: integer
            total_requests:
              type: integer
            active_mentorships:
              type: integer
            meetings_held:
              type: integer
            request_acceptance_rate:
              type: number
            request_match_rate:
              type: number
            avg_days_request_to_match:
              type: number
