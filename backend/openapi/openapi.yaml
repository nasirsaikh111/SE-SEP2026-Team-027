openapi: 3.0.3
info:
  title: Sangam API (Milestone 3, Sprint 1)
  version: 1.3.0
  description: |
    REST API of **Sangam**, the IITM BS student mentoring and career support platform (Team 027).
    Django REST Framework backend; all paths are under `/api/v1`. 79 operations. Every endpoint needs a JWT bearer token
    (`Authorization: Bearer <access>`) unless marked otherwise.

    **Roles:** STUDENT (primary user; Degree level), MENTOR (alumni volunteer, secondary), ADMIN (IIC / Placement Cell, tertiary).
    **Key rules (from the IIC requirements meeting):** the IIC keeps the mentor repository and approves every student and every
    match; students may browse a read-only directory and name one preferred mentor, but the system and the student only
    suggest; one mentor per student and one mentee per mentor; written feedback only (no ratings); meetings are logged by
    date and length, never content; contact details are shared only after the IIC approves the match.

    **Lists:** most list endpoints return `{count, next, previous, results}`.

    **Errors:** 400 validation error with a field → messages map (or a list of messages); 403 when not logged in **or** for
    the wrong role (missing or invalid tokens return 403, not 401, because SessionAuthentication is listed first in settings);
    401 only for a wrong password at /auth/token/; 404 unknown id; 405 unsupported method; 422 invalid AI parameter
    (`detail`, `field`); 429 rate limit; 503 AI provider timeout.

    **Known issues** found by testing and code review are noted in the affected operations ("Known issue (Sprint 2)") and listed in the
    Milestone 3 report.

    **User-story mapping.** Each operation lists its stories in `x-user-stories` and at the end of its description.
    Numbers are the user stories of the Milestone 1 report; NEW-n are stories added after the IIC meeting.

    | ID | User story |
    |---|---|
    | 1.1 | Record mentoring need |
    | 1.2 | Browse the mentor directory (read-only; the IIC still selects and approves) |
    | 1.3 | Submit a mentoring request with an optional preferred mentor (one open request) |
    | 1.4 | Track request status, dashboard and notifications |
    | 2.1 | Mentor keeps own professional details up to date (verification stays with the IIC) |
    | 2.2 | Mentor availability and capacity |
    | 2.3 | Mentor reviews the need before confirming availability |
    | 3.1 | System-suggested mentors for the IIC |
    | 3.2 | IIC checks availability and approves the match |
    | 3.3 | IIC mentor repository and verification |
    | 4.1 | Shared goals |
    | 4.2 | Meetings: log, schedule, confirm (date and length only) |
    | 4.3 | Mentor and student see their current mentorship |
    | 5.1 | Closing feedback (written, no ratings) |
    | 5.2 | Record outcomes |
    | 5.3 | Inactivity alerts |
    | 5.4 | Programme insights for the IIC |
    | NEW-1 | Student registration and IIC approval |
    | NEW-2 | IIC request queue, waiting list and prioritisation |
    | NEW-3 | Fortnightly mentor progress feedback |
    | NEW-4 | Change-of-mentor request and reassignment |
    | NEW-5 | End a mentorship |
    | NEW-6 | Audit history and moderation |
    | NEW-7 | Ask Sangam help assistant and its help articles |
servers:
- url: http://127.0.0.1:8000/api/v1
security:
- bearerAuth: []
tags:
- name: Auth & accounts
- name: IIC - student approvals
- name: IIC - mentor repository
- name: Requests
- name: IIC - matching
- name: Mentor
- name: Mentorships
- name: Feedback & outcomes
- name: Notifications
- name: IIC - monitoring
- name: Sprint 1 - Matching
- name: Sprint 1 - Priority
- name: Sprint 1 - Assistant
- name: Sprint 2 - Summaries
- name: Sprint 2 - Insights
- name: Health
- name: Dashboard
- name: Mentor directory
- name: Calendar
paths:
  /auth/me/:
    get:
      tags:
      - Auth & accounts
      operationId: getCurrentUser
      summary: Current user, role and (for students) approval status
      description: |-
        Drives role-based routing and shows the student's approval status. Only GET is supported; the frontend profile page sends PATCH /auth/me/, which returns 405.

        **User stories:** NEW-1 Student registration and IIC approval; 1.4 Track request status, dashboard and notifications
      x-user-stories:
      - NEW-1
      - '1.4'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/NotAuthenticated'
  /auth/mentor/activate/:
    post:
      tags:
      - Auth & accounts
      operationId: activateMentor
      summary: Mentor sets a password from the invitation link
      x-user-stories:
      - '3.3'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - uid
              - token
              - password
              properties:
                uid:
                  type: string
                  description: Base64 user id from the link
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated:
                    type: boolean
        '400':
          description: Invalid or expired invitation, or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
      description: |-
        **Known issue (Sprint 2):** a weak password (e.g. "123") returns HTTP 500 instead of 400, because Django's password validator error is not converted to a DRF validation error (accounts test TC-25).

        **User stories:** 3.3 IIC mentor repository and verification
  /auth/register/:
    post:
      tags:
      - Auth & accounts
      operationId: registerStudent
      summary: Student registers (account starts PENDING until the IIC approves it)
      description: |-
        Creates a STUDENT user and StudentProfile. The email must be an iitm.ac.in address (or a subdomain such as
        ds.study.iitm.ac.in). The account cannot request a mentor until the IIC approves it.

        **User stories:** NEW-1 Student registration and IIC approval
      x-user-stories:
      - NEW-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
            example:
              email: 23f1000001@ds.study.iitm.ac.in
              password: Str0ngPass!
              first_name: Meera
              last_name: Iyer
              iitm_roll_number: 23f1000001
              level: DEGREE
              courses:
              - MLF
              - MLT
              - DBMS
              cgpa: 8.2
      responses:
        '201':
          description: Registered, waiting for IIC approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  approval_status:
                    type: string
                    enum:
                    - PENDING
                  message:
                    type: string
                    example: IIC approval required.
        '400':
          description: 'Validation error: not an IITM email, email already registered, weak password, level not allowed, empty
            courses, CGPA outside 0–10'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
  /auth/token/:
    post:
      tags:
      - Auth & accounts
      operationId: login
      summary: Log in and receive a JWT access and refresh token pair
      description: |-
        Used by all three roles. The frontend reads the role from /auth/me/ and routes to /student, /mentor or /admin.

        **User stories:** NEW-1 Student registration and IIC approval
      x-user-stories:
      - NEW-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password, or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/token/refresh/:
    post:
      tags:
      - Auth & accounts
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      x-user-stories:
      - NEW-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '**User stories:** NEW-1 Student registration and IIC approval'
  /students/me/:
    get:
      tags:
      - Auth & accounts
      operationId: getStudentProfile
      summary: Student reads their academic profile and approval status
      x-user-stories:
      - NEW-1
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '403':
          description: Not logged in, or caller is not a student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** NEW-1 Student registration and IIC approval'
    patch:
      tags:
      - Auth & accounts
      operationId: updateStudentProfile
      summary: Student corrects academic details before approval (resets status to PENDING)
      description: |-
        Locked once the IIC has approved the profile.

        **User stories:** NEW-1 Student registration and IIC approval
      x-user-stories:
      - NEW-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfile'
      responses:
        '200':
          description: Updated profile (approval_status back to PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Not logged in, or not a student, or the profile is already approved and locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/students/:
    get:
      tags:
      - IIC - student approvals
      operationId: listStudentsForReview
      summary: IIC lists student registrations by approval status (default PENDING)
      x-user-stories:
      - NEW-1
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - ALL
          default: PENDING
      - name: search
        in: query
        description: Name, email or IITM roll number
        schema:
          type: string
      responses:
        '200':
          description: Up to 200 registrations, newest first
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        allOf:
                        - $ref: '#/components/schemas/StudentProfile'
                        - type: object
                          properties:
                            id:
                              type: integer
                            user_id:
                              type: integer
                            email:
                              type: string
                            name:
                              type: string
                            submitted_at:
                              type: string
                              format: date-time
                            approved_at:
                              type: string
                              format: date-time
                              nullable: true
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
      description: '**User stories:** NEW-1 Student registration and IIC approval'
  /admin/students/{id}/review/:
    post:
      tags:
      - IIC - student approvals
      operationId: reviewStudent
      summary: IIC approves or rejects a student registration against the checklist
      description: |-
        Approval requires `academic_verified: true` and a complete record (IITM roll number, level, courses, CGPA).
        Rejection requires a reason. The student is notified and the decision is written to the audit log.

        **User stories:** NEW-1 Student registration and IIC approval; NEW-6 Audit history and moderation
      x-user-stories:
      - NEW-1
      - NEW-6
      parameters:
      - name: id
        in: path
        required: true
        description: Student user id
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVED
                  - REJECTED
                reason:
                  type: string
                  description: Required when decision is REJECTED
                academic_verified:
                  type: boolean
                  default: false
                  description: Must be true to approve
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          description: Missing rejection reason, academic_verified not set, or incomplete academic record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/mentors/:
    get:
      tags:
      - IIC - mentor repository
      operationId: listMentors
      summary: IIC views the mentor repository
      x-user-stories:
      - '3.3'
      - '2.2'
      responses:
        '200':
          description: Up to 200 mentors
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/MentorProfile'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
      description: '**User stories:** 3.3 IIC mentor repository and verification; 2.2 Mentor availability and capacity'
      parameters:
      - name: verified
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: search
        in: query
        description: Name, email, role, company, specialty or domain
        schema:
          type: string
    post:
      tags:
      - IIC - mentor repository
      operationId: addMentor
      summary: IIC adds an alumni mentor to the repository (mentors do not self-register)
      description: |-
        Creates the mentor with no usable password; the IIC then sends an invitation (see /admin/mentors/{id}/invite/).

        **User stories:** 3.3 IIC mentor repository and verification; NEW-6 Audit history and moderation
      x-user-stories:
      - '3.3'
      - NEW-6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorCreate'
      responses:
        '201':
          description: Mentor added, not yet verified or activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  is_verified:
                    type: boolean
                    enum:
                    - false
                  activation:
                    type: string
        '400':
          description: Email already exists, or a field is missing or out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
  /admin/mentors/import/:
    post:
      tags:
      - IIC - mentor repository
      operationId: importMentors
      summary: IIC bulk-imports mentors from the alumni call (Sprint 1 placeholder)
      description: |-
        **Sprint 1 placeholder:** returns imported 0 for any input. CSV import is planned for Sprint 2.

        **User stories:** 3.3 IIC mentor repository and verification
      x-user-stories:
      - '3.3'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items:
                    $ref: '#/components/schemas/MentorCreate'
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  skipped:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
  /admin/mentors/{id}/:
    patch:
      tags:
      - IIC - mentor repository
      operationId: updateMentorByIIC
      summary: IIC edits a mentor's repository record, including whether they are published in the directory
      x-user-stories:
      - '3.3'
      - '2.2'
      parameters:
      - name: id
        in: path
        required: true
        description: Mentor user id
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorAdminUpdate'
      responses:
        '200':
          description: Updated mentor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** 3.3 IIC mentor repository and verification; 2.2 Mentor availability and capacity'
  /admin/mentors/{id}/invite/:
    post:
      tags:
      - IIC - mentor repository
      operationId: inviteMentor
      summary: IIC emails the mentor an activation link (token is never returned in the response)
      x-user-stories:
      - '3.3'
      parameters:
      - name: id
        in: path
        required: true
        description: Mentor user id
        schema:
          type: integer
      responses:
        '200':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                  email:
                    type: string
                  activation_screen_required:
                    type: boolean
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '**User stories:** 3.3 IIC mentor repository and verification'
  /admin/mentors/{id}/verify/:
    post:
      tags:
      - IIC - mentor repository
      operationId: verifyMentor
      summary: IIC marks a mentor as verified against alumni records
      description: |-
        Requires the alumni roll number and graduation year on the profile. Only verified mentors can be suggested. The frontend also sends `discoverable`, which this endpoint ignores; publish with PATCH /admin/mentors/{id}/.

        **User stories:** 3.3 IIC mentor repository and verification; NEW-6 Audit history and moderation
      x-user-stories:
      - '3.3'
      - NEW-6
      parameters:
      - name: id
        in: path
        required: true
        description: Mentor user id
        schema:
          type: integer
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentor_id:
                    type: integer
                  is_verified:
                    type: boolean
        '400':
          description: Alumni roll number or graduation year missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/mentorships/{id}/close/:
    post:
      tags:
      - IIC - monitoring
      operationId: closeMentorship
      summary: IIC ends a mentorship with a reason (also used before reassigning a student)
      x-user-stories:
      - NEW-5
      - NEW-4
      - NEW-6
      parameters:
      - $ref: '#/components/parameters/MentorshipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    enum:
                    - CLOSED
        '400':
          description: Reason missing or mentorship already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/ForbiddenIIC'
        '404':
          $ref: '#/components/responses/NotFound'
      description: |-
        Logs the closure in the audit history. The frontend also sends `closure_type`, which is currently ignored.

        **User stories:** NEW-5 End a mentorship; NEW-4 Change-of-mentor request and reassignment; NEW-6 Audit history and moderation
  /mentor/availability/:
    patch:
      tags:
      - Mentor
      operationId: setMentorAvailability
      summary: Verified mentor switches between Available and Busy
      description: |-
        Busy mentors are never suggested for new students; a current mentee is unaffected.

        **User stories:** 2.2 Mentor availability and capacity
      x-user-stories:
      - '2.2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - is_available
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: New availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_available:
                    type: boolean
        '400':
          description: is_available is not a boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not logged in, or caller is not a verified mentor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /mentor/profile/:
    get:
      tags:
      - Mentor
      operationId: getOwnMentorProfile
      summary: Mentor reads their own repository record
      x-user-stories:
      - '2.1'
      responses:
        '200':
          description: Mentor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorProfile'
        '403':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          description: Caller has no mentor profile (e.g. a student)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '**User stories:** 2.1 Mentor keeps own professional details up to date (verification stays with the IIC)'
    patch:
      tags:
      - Mentor
      operationId: updateOwnMentorProfile
      summary: Mentor updates their professional details (domain, role, bio, skills); verification stays with the IIC
      x-user-stories:
      - '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorSelfUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          description: Caller has no mentor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '**User stories:** 2.1 Mentor keeps own professional details up to date (verification stays with the IIC)'
  /mentors/:
    get:
      tags:
      - Mentor directory
      operationId: listDirectoryMentors
      summary: Approved students (and the IIC) browse verified, published mentors
      description: |-
        Read-only directory used to name one preferred mentor on a request. Choosing a preference never creates a
        mentorship: the IIC still checks availability and approves every match. Available mentors without a mentee are
        listed first. Paginated with `?page=` (50 per page).

        **User stories:** 1.2 Browse the mentor directory (read-only; the IIC still selects and approves)
      x-user-stories:
      - '1.2'
      parameters:
      - name: search
        in: query
        description: Name, role, company, specialty, domain or skill
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
      - name: specialty
        in: query
        schema:
          type: string
      - name: career_path
        in: query
        schema:
          type: string
      - name: available
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Page of directory entries (no email or contact details)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/DirectoryMentor'
        '403':
          description: Not logged in, or not an IIC-approved student or the IIC
          content:
