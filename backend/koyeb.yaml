name: sangam-backend
type: web
docker:
  dockerfile: Dockerfile
env:
  - key: DJANGO_DEBUG
    value: "false"
  - key: DJANGO_ALLOWED_HOSTS
    value: ".koyeb.app,localhost,127.0.0.1"
  - key: SANGAM_FRONTEND_URL
    value: "https://frontend-orpin-iota-73.vercel.app"
  - key: CORS_ALLOWED_ORIGINS
    value: "https://frontend-orpin-iota-73.vercel.app,https://sangam-step2.vercel.app,https://deploy-full-tau.vercel.app"
  - key: CSRF_TRUSTED_ORIGINS
    value: "https://frontend-orpin-iota-73.vercel.app,https://sangam-step2.vercel.app,https://deploy-full-tau.vercel.app"
ports:
  - port: 8000
    protocol: http
routes:
  - path: /
    port: 8000
